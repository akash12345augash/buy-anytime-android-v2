name: Build Buy Anytime APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d $HOME
          echo "$HOME/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find . -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK and AAB
        run: |
          PROJECT=$(find . -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "Android project: $PROJECT"
          cd "$PROJECT"
          gradle assembleDebug bundleRelease --stacktrace

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Buy-Anytime-Build
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            **/app/build/outputs/bundle/release/app-release.aab
